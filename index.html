  var ANCHOR_FIX = "<script>(function(){document.addEventListener(\"click\",function(e){var t=e.target;while(t&&t.tagName!==\"A\")t=t.parentElement;if(!t)return;var h=t.getAttribute(\"href\")||\"\";if(h.charAt(0)!==\"#\")return;e.preventDefault();var id=h.slice(1);if(!id){window.scrollTo({top:0});return;}var el=document.getElementById(id);if(el)el.scrollIntoView({block:\"start\"});},true);})();<\/script>";
  var GATE_CSS = "html,body{margin:0;min-height:100%;background:#0A1B3D}.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8DA2C0;font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;font-size:14px;letter-spacing:.4px;text-align:center;padding:0 24px;line-height:1.9}.gate b{color:#00C2A8;font-weight:600}";

  function fail(msg){
    document.title = '访问受限';
    var d = document.createElement('div');
    d.className = 'gate';
    d.innerHTML = msg;
    var st = document.createElement('style');
    st.textContent = GATE_CSS;
    document.head.appendChild(st);
    document.body.innerHTML = '';
    document.body.appendChild(d);
  }

  // 写入前清除外壳自身留下的痕迹（<style>/.gate），双保险
  function purgeShell(){
    var ns = document.querySelectorAll('style, link[rel="stylesheet"]');
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].parentNode) ns[i].parentNode.removeChild(ns[i]);
    }
    var g = document.querySelector('.gate');
    if (g && g.parentNode) g.parentNode.removeChild(g);
  }

  // 真正的渲染：必须在文档解析结束后调用（见 v3 修复说明）
  function render(html){
    var savedHash = location.hash;
    purgeShell();
    document.open();
    document.write(html);
    document.close();
    // open() 可能把地址栏上的 #密钥 抹掉，补回来，方便对方复制/再分享
    try {
      if (location.hash !== savedHash && savedHash) {
        history.replaceState(null, '', location.pathname + location.search + savedHash);
      }
    } catch (e) {}
  }

  // readyState 还是 loading 时调用 open() 会被浏览器忽略 → 一律等 load 之后
  function boot(html){
    html = html.replace(/<\/body>/i, ANCHOR_FIX + '</body>');
    if (document.readyState === 'complete') { render(html); }
    else { window.addEventListener('load', function(){ render(html); }); }
  }

  function b64ToBytes(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while (s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  var kb64 = location.hash.replace(/^#/, '');
  if (!kb64) { fail('此页面需要<b>完整分享链接</b>才能访问'); return; }
  if (!(window.crypto && crypto.subtle)) { fail('当前浏览器不支持安全访问，请用最新版 Chrome / Safari / Edge 打开'); return; }

  try {
    var raw  = b64ToBytes(PAYLOAD);
    var iv   = raw.slice(0, 12);
    var tag  = raw.slice(raw.length - 16);
    var ct   = raw.slice(12, raw.length - 16);
    var data = new Uint8Array(ct.length + tag.length);
    data.set(ct, 0); data.set(tag, ct.length);

    crypto.subtle.importKey('raw', b64ToBytes(kb64), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(function(k){ return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, data); })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        boot(html);
      })
      .catch(function(){ fail('链接无效或已失效'); });
  } catch (e) {
    fail('链接无效或已失效');
  }
})();
</script>
</body>
</html>
